[project]
name = "market-research-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing market data (SEC EDGAR, FRED, prices) to Claude."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "market-research-mcp contributors" }]
requires-python = ">=3.12"
dependencies = [
    "edgartools>=5.62.1",
    "httpx>=0.28.1",
    "mcp>=1.30,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
market-research-mcp = "market_research_mcp.server:main"

[project.optional-dependencies]
yfinance = [
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: needs real API keys and network access (skipped in CI)",
    "latency: measures response latency",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
